  <ellipse cx="590" cy="600" rx="250" ry="175" fill="#8d6e63"/>
  <!-- belly -->
  <path d="M400 640 C470 760 700 780 820 660 C760 740 520 760 400 640Z" fill="#a1887f"/>
  <!-- front legs (light) -->
  <rect x="420" y="680" width="82" height="185" rx="38" fill="#f5e6d3"/>
  <rect x="510" y="700" width="82" height="165" rx="38" fill="#efdcc5"/>
  <path d="M420 835 h82 v10 a20 20 0 0 1 -20 20 h-42 a20 20 0 0 1 -20 -20z" fill="#3e2723"/>
  <path d="M510 835 h82 v10 a20 20 0 0 1 -20 20 h-42 a20 20 0 0 1 -20 -20z" fill="#3e2723"/>
  <!-- shoulder stripe -->
  <path d="M430 470 C540 520 640 600 690 700 L630 720 C590 630 510 560 410 520 Z" fill="#fff4e6"/>
  <path d="M440 500 C540 545 615 615 655 705 L612 718 C575 640 505 585 420 545 Z" fill="#2a1a2e"/>
  <!-- head + snout -->
  <path d="M470 440 C420 420 360 440 320 480 C270 525 180 590 110 640 C95 652 100 672 120 672 C200 668 300 640 380 620 C440 605 480 580 490 540 Z" fill="#a1887f"/>
  <!-- nose -->
  <ellipse cx="112" cy="652" rx="26" ry="22" fill="#2a1a2e"/>
  <!-- tongue -->
  <path d="M100 668 C80 700 70 720 85 735" stroke="#ff5c93" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- ear -->
  <ellipse cx="455" cy="455" rx="34" ry="44" fill="#6d4c41" transform="rotate(-20 455 455)"/>
  <ellipse cx="455" cy="460" rx="18" ry="26" fill="#ff9a9e" transform="rotate(-20 455 460)"/>
  <!-- eye -->
  <circle cx="380" cy="520" r="30" fill="#2a1a2e"/>
  <circle cx="370" cy="508" r="11" fill="#fff"/>
  <circle cx="390" cy="530" r="5" fill="#fff"/>
  <!-- cheek -->
  <ellipse cx="340" cy="575" rx="30" ry="18" fill="#ff5c93" opacity=".55"/>
  <!-- smile -->
  <path d="M250 600 C270 615 295 615 312 602" stroke="#2a1a2e" stroke-width="8" fill="none" stroke-linecap="round"/>
</g>
</svg>
