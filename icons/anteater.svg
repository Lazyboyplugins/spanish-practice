<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0" stop-color="#ffd24d"/>
      <stop offset="0.55" stop-color="#ff7a00"/>
      <stop offset="1" stop-color="#e91e63"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- papel picado strip -->
  <g>
    <path d="M0 0H1024V96L960 136 896 96 832 136 768 96 704 136 640 96 576 136 512 96 448 136 384 96 320 136 256 96 192 136 128 96 64 136 0 96Z" fill="#00a99d"/>
    <path d="M0 0H1024V60H0Z" fill="#8e44ad"/>
    <g fill="#ffffff" opacity=".85">
      <circle cx="64" cy="98" r="10"/><circle cx="192" cy="98" r="10"/><circle cx="320" cy="98" r="10"/>
      <circle cx="448" cy="98" r="10"/><circle cx="576" cy="98" r="10"/><circle cx="704" cy="98" r="10"/>
      <circle cx="832" cy="98" r="10"/><circle cx="960" cy="98" r="10"/>
    </g>
  </g>
  <g transform="translate(70 40) scale(0.9)">
  <!-- ground shadow -->
  <ellipse cx="560" cy="870" rx="330" ry="34" fill="#7a0f3a" opacity=".25"/>
  <!-- tail -->
  <path d="M760 600 C820 520 830 400 900 300 C960 380 990 470 960 560 C930 650 860 700 780 700 Z" fill="#5d4037"/>
  <path d="M800 600 C850 530 860 440 905 360 C940 430 950 500 925 565 C900 630 850 660 800 660 Z" fill="#795548"/>
  <!-- back legs -->
  <rect x="640" y="690" width="78" height="170" rx="36" fill="#5d4037"/>
  <rect x="720" y="680" width="78" height="175" rx="36" fill="#6d4c41"/>
